<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: {{INK}};
        --cream: {{CREAM}};
        --red: {{RED}};
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{W}}px;
        height: {{H}}px;
        overflow: hidden;
        background: var(--ink);
      }
      #root { position: relative; width: 100%; height: 100%; }
      #base { position: absolute; inset: 0; background: var(--ink); }
      #grain {
        position: absolute;
        inset: 0;
        background-image: url('assets/grain.png');
        background-size: 512px 512px;
        mix-blend-mode: overlay;
        opacity: 0.16;
        pointer-events: none;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DUR}}"
      data-width="{{W}}"
      data-height="{{H}}"
    >
      <div id="base"></div>
      {{HOSTS}}
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="{{DUR}}" data-track-index="6" data-track-kind="captions"
        data-width="{{W}}" data-height="{{H}}" style="z-index:20"></div>
      <div id="grain" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="7" data-layout-ignore></div>
      <audio id="voix" class="clip" src="{{AUDIO}}" data-start="0" data-duration="{{DUR}}" data-track-index="8" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{GRAIN_JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
